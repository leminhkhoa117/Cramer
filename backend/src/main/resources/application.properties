# ===========================================
# SERVER CONFIGURATION
# ===========================================
server.port=${SERVER_PORT:8080}

# ===========================================
# DATABASE CONFIGURATION (Supabase PostgreSQL)
# ===========================================
# Datasource (Supabase uses PostgreSQL)
# Prefer providing a full JDBC URL via SPRING_DATASOURCE_URL. Example:
# jdbc:postgresql://db.<project>.supabase.co:5432/postgres?sslmode=require&prepareThreshold=0
# prepareThreshold=0 disables server-side prepared statements to avoid cache conflicts with connection pooling
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_MAX_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_CONN_TIMEOUT:30000}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_MAX_LIFETIME:1800000}
# Connection validation - test connections before use to handle dropped connections
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000
# Keep connections alive during idle periods
spring.datasource.hikari.keepalive-time=300000
# Disable prepared statement cache to avoid conflicts with Supabase PgBouncer
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMiB=0
# Auto-commit mode for better compatibility with connection pooling
spring.datasource.hikari.auto-commit=true

# ===========================================
# JPA/HIBERNATE CONFIGURATION
# ===========================================
# Ensure Hibernate uses the PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate DDL auto mode (create, create-drop, update, validate, none)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HBM2DDL:validate}

# Show SQL queries in console (useful for debugging)
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Format SQL for better readability
spring.jpa.properties.hibernate.format_sql=true

# Hibernate naming strategy (use snake_case for database columns)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===========================================
# SUPABASE REST API CONFIGURATION
# ===========================================
# Supabase REST API base URL (including /rest/v1)
supabase.url=${SUPABASE_URL:}

# Supabase anon key (public, safe for client-side)
supabase.anon-key=${SUPABASE_ANON_KEY:}

# Supabase service role key (KEEP SECRET! Server-side only)
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}

# ===========================================
# SUPABASE AUTH CONFIGURATION
# ===========================================
# JWT Secret for validating Supabase tokens
# Get this from Supabase Dashboard > Settings > API > JWT Secret
# SECURITY: No default value - application will fail to start if not set
supabase.jwt.secret=${SUPABASE_JWT_SECRET}


# ===========================================
# LLM CONFIGURATION (Server-side DeepSeek)
# ===========================================
# Server-side API key (optional - users can also set their own in profile)
# If set, this key will be used as fallback when user has no key configured
llm.api-key=${DEEPSEEK_API_KEY:}

# Default model for grading (deepseek-chat = fast, deepseek-reasoner = accurate)
llm.model=${DEEPSEEK_MODEL:deepseek-reasoner}

# DeepSeek API base URL
llm.base-url=https://api.deepseek.com

# ===========================================
# OPENROUTER API CONFIGURATION (ABTS)
# ===========================================
# OpenRouter API key for AI-Based Test Generation System
# Get your key at https://openrouter.ai/keys
openrouter.api-key=${OPENROUTER_API_KEY:}

# OpenRouter API base URL
openrouter.base-url=https://openrouter.ai/api/v1

# Site attribution for OpenRouter rankings
openrouter.site-url=${OPENROUTER_SITE_URL:https://cramer.vn}
openrouter.site-name=${OPENROUTER_SITE_NAME:Cramer ABTS}

# Default models for ABTS generation tasks
openrouter.generation-model=${OPENROUTER_GENERATION_MODEL:mistralai/devstral-2512:free}
openrouter.regeneration-model=${OPENROUTER_REGENERATION_MODEL:deepseek/deepseek-chat}
openrouter.json-fix-model=${OPENROUTER_JSON_FIX_MODEL:meta-llama/llama-3.1-70b-instruct:free}

# API timeout (2 minutes for content generation)
openrouter.timeout-ms=${OPENROUTER_TIMEOUT_MS:120000}

# Enable streaming for real-time generation view
openrouter.streaming-enabled=${OPENROUTER_STREAMING_ENABLED:true}

# ===========================================
# PAYOS PAYMENT GATEWAY CONFIGURATION
# ===========================================
# PayOS Client ID (from PayOS Merchant Dashboard)
payos.client-id=${PAYOS_CLIENT_ID:}

# PayOS API Key (from PayOS Merchant Dashboard)
payos.api-key=${PAYOS_API_KEY:}

# PayOS Checksum Key (for HMAC-SHA256 signature)
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}

# PayOS API Base URL
payos.base-url=https://api-merchant.payos.vn

# Return URL after successful payment
payos.return-url=${PAYOS_RETURN_URL:http://localhost:5173/payment/success}

# Cancel URL when user cancels payment
payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:5173/payment/cancel}

# Webhook URL for PayOS notifications (must be publicly accessible in production)
payos.webhook-url=${PAYOS_WEBHOOK_URL:}

# ===========================================
# SWAGGER/OPENAPI CONFIGURATION
# ===========================================
# Swagger UI path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# API Docs path
springdoc.api-docs.path=/v3/api-docs

# Group all APIs
springdoc.group-configs[0].group=cramer-api
springdoc.group-configs[0].paths-to-match=/**

# ===========================================
# GEMINI LIVE API CONFIGURATION (Speaking Feature)
# ===========================================
# Google Cloud Project ID
google.cloud.project.id=${GOOGLE_CLOUD_PROJECT_ID:}

# Path to Google Cloud service account credentials JSON file
# Get this from Google Cloud Console > IAM & Admin > Service Accounts
google.cloud.credentials.path=${GOOGLE_APPLICATION_CREDENTIALS:}

# Gemini Live API endpoint for real-time conversation
gemini.live.api.endpoint=${GEMINI_LIVE_ENDPOINT:generativelanguage.googleapis.com}

# Speaking session runtime pricing
speaking.session.lua-cost=${SPEAKING_LUA_COST:15}
speaking.session.lua-check-on-create=${SPEAKING_LUA_CHECK_ON_CREATE:true}
speaking.session.lua-charge-on-complete=${SPEAKING_LUA_CHARGE_ON_COMPLETE:true}
speaking.session.part1.bank-size=${SPEAKING_PART1_BANK_SIZE:30}
speaking.session.part1.min-selected=${SPEAKING_PART1_MIN_SELECTED:8}
speaking.session.part1.max-selected=${SPEAKING_PART1_MAX_SELECTED:12}
speaking.session.part2.bank-size=${SPEAKING_PART2_BANK_SIZE:1}
speaking.session.part2.min-selected=${SPEAKING_PART2_MIN_SELECTED:1}
speaking.session.part2.max-selected=${SPEAKING_PART2_MAX_SELECTED:1}
speaking.session.part3.bank-size=${SPEAKING_PART3_BANK_SIZE:15}
speaking.session.part3.min-selected=${SPEAKING_PART3_MIN_SELECTED:3}
speaking.session.part3.max-selected=${SPEAKING_PART3_MAX_SELECTED:6}
speaking.session.part3.defer-until-context=${SPEAKING_PART3_DEFER_UNTIL_CONTEXT:true}

# Gemini model for live conversation (gemini-2.0-flash-live recommended)
# Gemini API Key (alternative to service account credentials)
gemini.api.key=${GEMINI_API_KEY:}

# ===========================================
# DEBUG CONFIGURATION (DEVELOPMENT ONLY)
# ===========================================
# Enable debug endpoints (set to true ONLY in development)
app.debug.enabled=${DEBUG_ENABLED:false}

# Secret key required for debug endpoints (generate a random string)
# Example: DEBUG_SECRET_KEY=my-super-secret-dev-key-12345
app.debug.secret-key=${DEBUG_SECRET_KEY:}
