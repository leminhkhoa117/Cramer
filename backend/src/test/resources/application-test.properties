# =============================================================================
# Cramer Backend - Test Configuration
# =============================================================================
# This file configures the application for unit and integration testing.
# Uses H2 in-memory database to avoid touching production data.

# =============================================================================
# Datasource Configuration (H2 In-Memory)
# =============================================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =============================================================================
# JPA/Hibernate Configuration
# =============================================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =============================================================================
# Supabase Configuration (Mock/Test values)
# =============================================================================
supabase.url=http://localhost:54321
supabase.key=test-anon-key
supabase.jwt.secret=test-jwt-secret-key-that-is-at-least-32-characters-long
supabase.service.key=test-service-key

# =============================================================================
# PayOS Configuration (Disabled/Mock for tests)
# =============================================================================
payos.client-id=
payos.api-key=
payos.checksum-key=test-checksum-key
payos.return-url=http://localhost:5173/payment/success
payos.cancel-url=http://localhost:5173/payment/cancel

# =============================================================================
# DeepSeek LLM Configuration (Mock for tests)
# =============================================================================
deepseek.api.key=test-api-key
deepseek.api.url=https://api.deepseek.com
deepseek.model=deepseek-chat

# =============================================================================
# Logging Configuration (Minimal for tests)
# =============================================================================
logging.level.root=WARN
logging.level.com.cramer=INFO
logging.level.org.springframework.test=INFO

# =============================================================================
# Server Configuration
# =============================================================================
server.port=0
